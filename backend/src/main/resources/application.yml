server:
  port: ${PORT:8080}
  forward-headers-strategy: framework
  error:
    include-message: never
    include-stacktrace: never

spring:
  application:
    name: resqlink-backend
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/resqlink}
    username: ${DATABASE_USERNAME:resqlink}
    password: ${DATABASE_PASSWORD:resqlink}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none # schema is owned by Flyway migrations
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  servlet:
    multipart:
      max-file-size: 6MB
      max-request-size: 7MB
  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false

logging:
  pattern:
    level: "%5p [req=%X{requestId:-}]"

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,db
        liveness:
          include: livenessState

resqlink:
  jwt:
    # MUST be overridden in every real deployment (min 32 characters).
    secret: ${JWT_SECRET:}
    expiry-hours: ${JWT_EXPIRY_HOURS:12}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  upload-dir: ${UPLOAD_DIR:./uploads}
  demo-mode: ${DEMO_MODE:false}
  storage:
    type: ${STORAGE_TYPE:local}
    bucket: ${S3_BUCKET:}
    region: ${S3_REGION:auto}
    endpoint: ${S3_ENDPOINT:}
    access-key: ${S3_ACCESS_KEY:}
    secret-key: ${S3_SECRET_KEY:}
    migrate-local-on-startup: ${STORAGE_MIGRATE_LOCAL:false}
  seed-demo-data: ${SEED_DEMO_DATA:false}
  demo-password: ${DEMO_PASSWORD:}
  rate-limit:
    auth-per-minute: ${RATE_LIMIT_AUTH_PER_MINUTE:20}
    report-per-minute: ${RATE_LIMIT_REPORT_PER_MINUTE:6}
  nexconn:
    app-key: ${NEXCONN_APP_KEY:}
    app-secret: ${NEXCONN_APP_SECRET:}
    # Server API domain from the Nexconn console, e.g. https://api-xx.nexconn.ai (no default is assumed).
    api-domain: ${NEXCONN_API_DOMAIN:}
    webhook-max-skew-seconds: ${NEXCONN_WEBHOOK_MAX_SKEW_SECONDS:300}
  gemini:
    api-key: ${GEMINI_API_KEY:}
    model: ${GEMINI_MODEL:gemini-2.5-flash}
    embedding-model: ${GEMINI_EMBEDDING_MODEL:gemini-embedding-001}
    base-url: ${GEMINI_BASE_URL:https://generativelanguage.googleapis.com/v1beta}
    timeout-seconds: ${GEMINI_TIMEOUT_SECONDS:20}
    # Evidence photos are sent to Gemini for analysis unless this is false (see docs/PRIVACY.md).
    send-images: ${GEMINI_SEND_IMAGES:true}
    # USD per 1M tokens, from your Gemini pricing page. Leave unset and no cost estimate is reported.
    price-in-per-million: ${GEMINI_PRICE_IN_PER_MILLION:}
    price-out-per-million: ${GEMINI_PRICE_OUT_PER_MILLION:}
